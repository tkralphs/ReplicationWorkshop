name: Build Jekyll site

# Builds on every push to main and on manual dispatch.
# Deployment to GitHub Pages is GATED: it only runs when the repository
# variable DEPLOY_PAGES is "true" (or a manual dispatch asks for it).
# Nothing is published until Pages is enabled and that variable is set.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (requires Pages to be enabled)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Report build output
        run: |
          echo "Site size: $(du -sh _site | cut -f1)"
          echo "Files:"
          find _site -type f | sort | sed 's/^/  /'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      # Separate, longer-lived copy of the rendered site that can be
      # downloaded from the run page (kept 30 days; the Pages artifact is 1 day).
      - name: Upload rendered site for download
        uses: actions/upload-artifact@v4
        with:
          name: rendered-site
          path: ./_site
          retention-days: 30

  deploy:
    needs: build
    if: vars.DEPLOY_PAGES == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
