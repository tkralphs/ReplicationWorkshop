# Jekyll configuration — Workshop on Replication in the Journal Review Process
# Lehigh University, August 19-20, 2027

title: "Workshop on Replication in the Journal Review Process"
short_title: "Replication Workshop 2027"
description: >-
  A workshop on replication in the journal review process, held at Lehigh
  University on August 19-20, 2027, immediately following MOPTA 2027.
  Bringing editors and authors together to share experience and develop
  shared guidance.

# Hosted on COR@L under an Apache alias: https://coral.ise.lehigh.edu/~lrw2027/
# `url` is the host only; `baseurl` is the path the site is served under, and
# every asset link is prefixed with it. If baseurl is "" the page looks for
# /assets/... at the server root and renders unstyled.
url: "https://coral.ise.lehigh.edu"
baseurl: "/~lrw2027"

# Contact / links used across the site
contact_email: "ted@lehigh.edu"
mopta_url: "https://coral.ise.lehigh.edu/mopta2027/"
lehigh_ise_url: "https://engineering.lehigh.edu/ise"
lios_url: "https://coral.ise.lehigh.edu/lios/"

markdown: kramdown
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - render_preview.py
  - check_preview.py
  - make_portable.py
  - vendor
  - .bundle
  - .gitignore
