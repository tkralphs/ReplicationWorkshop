<section id="sponsors" class="section section-alt sponsors">
  <div class="wrap">
    <div class="section-head">
      <h2>Sponsors</h2>
      <p class="section-sub">
        The workshop is a thematic workshop of the LIOS program, sponsored by
        LIOS and by Lehigh's Department of Industrial and Systems Engineering.
      </p>
    </div>
    <div class="sponsor-logos">
      <!-- LIOS has no logo of its own; its site uses the ISE seal, so the
           seal plus the program name stands in. To use a real LIOS logo,
           replace the contents of this link with a single <img>. -->
      <a class="sponsor-logo" href="{{ site.lios_url }}">
        <img class="sponsor-seal" src="{{ site.baseurl }}/assets/img/sponsors/ise-seal.jpg"
             alt="" width="118" height="118">
        <span class="sponsor-wordmark">
          <span class="sponsor-wordmark-name">LIOS</span>
          <span class="sponsor-wordmark-desc">Lehigh ISE Optimization Science Program</span>
        </span>
      </a>
      <a class="sponsor-logo" href="{{ site.lehigh_ise_url }}">
        <img src="{{ site.baseurl }}/assets/img/sponsors/lehigh-ise.jpg"
             alt="Industrial and Systems Engineering, Lehigh University"
             width="600" height="243">
      </a>
    </div>
  </div>
</section>
